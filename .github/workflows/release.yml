name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Check tag matches __version__
        shell: bash
        run: |
          ver=$(python -c "import downloader; print(downloader.__version__)")
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$ver"; exit 1; }
      - run: pytest -q
      # Inno Setup is preinstalled on windows-latest; build.py finds ISCC.exe.
      - run: python build/build.py
      # Code signing (strongly recommended to avoid SmartScreen warnings):
      # add a step here that signs dist/Downloader/Downloader.exe *before* the installer is
      # built, and the Setup.exe after, e.g. with signtool + a certificate stored in secrets.
      - name: Package browser extension
        shell: bash
        run: cd browser-extension && 7z a ../dist/Downloader-browser-extension.zip . > /dev/null
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/Downloader-${GITHUB_REF_NAME#v}-Setup.exe dist/SHA256SUMS.txt dist/Downloader-browser-extension.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Downloader ${GITHUB_REF_NAME#v}"               --generate-notes $files
          fi
