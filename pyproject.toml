[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downloader"
version = "0.1.0"
description = "Desktop video downloader with library organization, scheduling and playlist sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "qtawesome>=1.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.8", "pillow>=10"]

[project.scripts]
downloader = "downloader.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: tests that hit the internet"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: QModelIndex() defaults are the Qt idiom. UP042: str-Enum is deliberate for SQLAlchemy.
ignore = ["B008", "UP042", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
